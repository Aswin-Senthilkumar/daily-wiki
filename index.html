<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Daily Wiki — One article. One day.</title>
    <meta name="description" content="One curated Wikipedia article per day. Stay curious." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A1A2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Daily Wiki" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Open Graph / social -->
    <meta property="og:title" content="Daily Wiki" />
    <meta property="og:description" content="One curated Wikipedia article per day." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dailywiki.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6239569520497260" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker (only in production)
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) =>
            console.warn('SW registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
